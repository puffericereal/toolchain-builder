name: Build aarch64 Android Toolchain for CM11

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: ubuntu:18.04

    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y ca-certificates
          dpkg --add-architecture arm64
          # arm64 packages are on ports.ubuntu.com not archive.ubuntu.com
          cat > /etc/apt/sources.list <<SOURCES
deb [arch=amd64] http://archive.ubuntu.com/ubuntu bionic main restricted universe multiverse
deb [arch=amd64] http://archive.ubuntu.com/ubuntu bionic-updates main restricted universe multiverse
deb [arch=amd64] http://archive.ubuntu.com/ubuntu bionic-backports main restricted universe multiverse
deb [arch=amd64] http://security.ubuntu.com/ubuntu bionic-security main restricted universe multiverse
deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports bionic main restricted universe multiverse
deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports bionic-updates main restricted universe multiverse
deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports bionic-security main restricted universe multiverse
SOURCES
          apt-get update
          apt-get install -y \
            build-essential \
            gcc g++ \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            libgmp-dev libmpfr-dev libmpc-dev \
            libgmp-dev:arm64 libmpfr-dev:arm64 libmpc-dev:arm64 \
            libisl-dev libisl-dev:arm64 \
            flex bison texinfo \
            curl wget git zip patchelf \
            ca-certificates xz-utils

      - name: Verify host compiler
        run: |
          aarch64-linux-gnu-gcc --version
          aarch64-linux-gnu-g++ --version

      - name: Set env
        run: |
          echo "BINUTILS_VER=2.27"            >> $GITHUB_ENV
          echo "GCC_VER=4.7.4"                >> $GITHUB_ENV
          echo "TARGET_ANDROID=arm-linux-androideabi" >> $GITHUB_ENV
          echo "TARGET_EABI=arm-eabi"         >> $GITHUB_ENV
          echo "HOST=aarch64-linux-gnu"       >> $GITHUB_ENV
          echo "PREFIX=/root/tc"              >> $GITHUB_ENV
          echo "CC=aarch64-linux-gnu-gcc"     >> $GITHUB_ENV
          echo "CXX=aarch64-linux-gnu-g++"    >> $GITHUB_ENV
          echo "AR=aarch64-linux-gnu-ar"      >> $GITHUB_ENV
          echo "RANLIB=aarch64-linux-gnu-ranlib" >> $GITHUB_ENV

      - name: Download sources
        run: |
          wget -q https://ftp.gnu.org/gnu/binutils/binutils-2.27.tar.gz
          wget -q https://ftp.gnu.org/gnu/gcc/gcc-4.7.4/gcc-4.7.4.tar.gz
          tar xf binutils-2.27.tar.gz
          tar xf gcc-4.7.4.tar.gz
          cd gcc-4.7.4 && ./contrib/download_prerequisites

      - name: Patch config.sub and config.guess for aarch64
        run: |
          wget -q 'https://git.savannah.gnu.org/cgit/config.git/plain/config.sub' \
            -O config.sub.new
          wget -q 'https://git.savannah.gnu.org/cgit/config.git/plain/config.guess' \
            -O config.guess.new
          for dir in gcc-4.7.4 binutils-2.27; do
            find $dir -name 'config.sub'   -exec cp config.sub.new   {} \;
            find $dir -name 'config.guess' -exec cp config.guess.new {} \;
          done
          echo "patched"

      - name: Patch GCC 4.7 for modern host compiler
        run: |
          cd gcc-4.7.4
          # Fix: error: 'struct siginfo' has no member named 'si_utime'
          sed -i 's/sa.sa_flags = SA_SIGINFO/sa.sa_flags = 0/g' \
            gcc/collect2.c 2>/dev/null || true
          # Fix: conflicting declaration with glibc 2.26+
          sed -i '/#include <unistd.h>/a #undef HAVE_DECL_STPCPY' \
            libiberty/stpcpy.c 2>/dev/null || true
          # Fix: strict aliasing in fixincludes
          sed -i 's/-Werror//' fixincludes/Makefile.in 2>/dev/null || true
          echo "patched gcc 4.7.4 for modern host"

      - name: Build binutils (arm-linux-androideabi)
        run: |
          mkdir -p build-binutils-android && cd build-binutils-android
          ../binutils-2.27/configure \
            --prefix=/root/tc/arm-linux-androideabi-4.7 \
            --target=arm-linux-androideabi \
            --host=aarch64-linux-gnu \
            --build=x86_64-linux-gnu \
            --disable-nls \
            --disable-multilib \
            --disable-werror \
            --with-sysroot
          make -j$(nproc) CC=aarch64-linux-gnu-gcc CXX=aarch64-linux-gnu-g++ \
            AR=aarch64-linux-gnu-ar RANLIB=aarch64-linux-gnu-ranlib
          make install

      - name: Build GCC (arm-linux-androideabi)
        run: |
          mkdir -p build-gcc-android && cd build-gcc-android
          ../gcc-4.7.4/configure \
            --prefix=/root/tc/arm-linux-androideabi-4.7 \
            --target=arm-linux-androideabi \
            --host=aarch64-linux-gnu \
            --build=x86_64-linux-gnu \
            --enable-languages=c,c++ \
            --disable-nls \
            --disable-multilib \
            --disable-shared \
            --disable-libssp \
            --disable-libgomp \
            --disable-libmudflap \
            --with-arch=armv7-a \
            --with-float=softfp \
            --with-fpu=vfpv3-d16 \
            --with-gnu-as \
            --with-gnu-ld \
            --disable-werror \
            --with-gmp=/usr \
            --with-mpfr=/usr \
            --with-mpc=/usr
          make -j$(nproc) all-gcc \
            CC=aarch64-linux-gnu-gcc \
            CXX=aarch64-linux-gnu-g++ \
            AR=aarch64-linux-gnu-ar \
            RANLIB=aarch64-linux-gnu-ranlib
          make install-gcc
          make -j$(nproc) all-target-libgcc \
            CC=aarch64-linux-gnu-gcc \
            CXX=aarch64-linux-gnu-g++ \
            AR=aarch64-linux-gnu-ar \
            RANLIB=aarch64-linux-gnu-ranlib
          make install-target-libgcc

      - name: Build binutils (arm-eabi)
        run: |
          mkdir -p build-binutils-eabi && cd build-binutils-eabi
          ../binutils-2.27/configure \
            --prefix=/root/tc/arm-eabi-4.7 \
            --target=arm-eabi \
            --host=aarch64-linux-gnu \
            --build=x86_64-linux-gnu \
            --disable-nls \
            --disable-multilib \
            --disable-werror
          make -j$(nproc) CC=aarch64-linux-gnu-gcc CXX=aarch64-linux-gnu-g++ \
            AR=aarch64-linux-gnu-ar RANLIB=aarch64-linux-gnu-ranlib
          make install

      - name: Build GCC (arm-eabi)
        run: |
          mkdir -p build-gcc-eabi && cd build-gcc-eabi
          ../gcc-4.7.4/configure \
            --prefix=/root/tc/arm-eabi-4.7 \
            --target=arm-eabi \
            --host=aarch64-linux-gnu \
            --build=x86_64-linux-gnu \
            --enable-languages=c,c++ \
            --disable-nls \
            --disable-multilib \
            --disable-shared \
            --disable-threads \
            --disable-libssp \
            --disable-libgomp \
            --disable-libmudflap \
            --without-headers \
            --with-newlib \
            --disable-werror \
            --with-gmp=/usr \
            --with-mpfr=/usr \
            --with-mpc=/usr
          make -j$(nproc) all-gcc \
            CC=aarch64-linux-gnu-gcc \
            CXX=aarch64-linux-gnu-g++ \
            AR=aarch64-linux-gnu-ar \
            RANLIB=aarch64-linux-gnu-ranlib
          make install-gcc
          make -j$(nproc) all-target-libgcc \
            CC=aarch64-linux-gnu-gcc \
            CXX=aarch64-linux-gnu-g++ \
            AR=aarch64-linux-gnu-ar \
            RANLIB=aarch64-linux-gnu-ranlib
          make install-target-libgcc

      - name: Bundle glibc alongside toolchain
        run: |
          GLIBC_DIR=/root/tc/glibc
          mkdir -p $GLIBC_DIR
          for bin in \
            /root/tc/arm-linux-androideabi-4.7/bin/arm-linux-androideabi-gcc \
            /root/tc/arm-linux-androideabi-4.7/bin/arm-linux-androideabi-g++ \
            /root/tc/arm-linux-androideabi-4.7/bin/arm-linux-androideabi-as \
            /root/tc/arm-linux-androideabi-4.7/bin/arm-linux-androideabi-ld \
            /root/tc/arm-eabi-4.7/bin/arm-eabi-gcc \
            /root/tc/arm-eabi-4.7/bin/arm-eabi-g++ \
            /root/tc/arm-eabi-4.7/bin/arm-eabi-as \
            /root/tc/arm-eabi-4.7/bin/arm-eabi-ld; do
            [ -f "$bin" ] || continue
            ldd "$bin" | awk '{print $3}' | grep '^/' | while read lib; do
              cp -n "$lib" $GLIBC_DIR/ 2>/dev/null || true
            done
          done
          # Copy dynamic linker
          find /lib -name 'ld-linux-aarch64*' \
            -exec cp {} $GLIBC_DIR/ \; 2>/dev/null || true
          find /lib/aarch64-linux-gnu -name 'ld-linux-aarch64*' \
            -exec cp {} $GLIBC_DIR/ \; 2>/dev/null || true
          echo "bundled libs:"; ls $GLIBC_DIR/

      - name: Patch binaries to use bundled glibc
        run: |
          GLIBC_DIR=/root/tc/glibc
          INTERP=$(find $GLIBC_DIR -name 'ld-linux-aarch64*' | head -1)
          echo "interpreter: $INTERP"
          for bin in \
            /root/tc/arm-linux-androideabi-4.7/bin/arm-linux-androideabi-gcc \
            /root/tc/arm-linux-androideabi-4.7/bin/arm-linux-androideabi-g++ \
            /root/tc/arm-linux-androideabi-4.7/bin/arm-linux-androideabi-as \
            /root/tc/arm-linux-androideabi-4.7/bin/arm-linux-androideabi-ld \
            /root/tc/arm-eabi-4.7/bin/arm-eabi-gcc \
            /root/tc/arm-eabi-4.7/bin/arm-eabi-g++ \
            /root/tc/arm-eabi-4.7/bin/arm-eabi-as \
            /root/tc/arm-eabi-4.7/bin/arm-eabi-ld; do
            [ -f "$bin" ] || continue
            patchelf --set-interpreter "$INTERP" \
                     --set-rpath "$GLIBC_DIR" \
                     "$bin" && echo "patched: $bin" || true
          done

      - name: Create launcher wrappers
        run: |
          GLIBC_DIR=/root/tc/glibc
          for toolchain in arm-linux-androideabi-4.7 arm-eabi-4.7; do
            BINDIR=/root/tc/$toolchain/bin
            for bin in $BINDIR/*; do
              [ -f "$bin" ] && [ ! -L "$bin" ] || continue
              real="${bin}.real"
              mv "$bin" "$real"
              printf '#!/bin/sh\nexport LD_LIBRARY_PATH="%s:$LD_LIBRARY_PATH"\nexec "%s" "$@"\n' \
                "$GLIBC_DIR" "$real" > "$bin"
              chmod +x "$bin"
            done
          done

      - name: Verify
        run: |
          /root/tc/arm-linux-androideabi-4.7/bin/arm-linux-androideabi-gcc --version
          /root/tc/arm-eabi-4.7/bin/arm-eabi-gcc --version
          file /root/tc/arm-linux-androideabi-4.7/bin/arm-linux-androideabi-gcc.real

      - name: Package
        run: |
          cd /root
          tar cJf toolchain-aarch64-cm11.tar.xz tc/
          ls -lh toolchain-aarch64-cm11.tar.xz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: toolchain-aarch64-cm11
          path: /root/toolchain-aarch64-cm11.tar.xz
          retention-days: 30
