name: Build aarch64 Android Toolchain for CM11

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: ubuntu:18.04

    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y \
            build-essential \
            libgmp-dev libmpfr-dev libmpc-dev \
            libisl-dev \
            flex bison texinfo \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            curl wget git zip patchelf \
            ca-certificates

      - name: Verify host compiler
        run: |
          aarch64-linux-gnu-gcc --version
          aarch64-linux-gnu-g++ --version

      - name: Set versions
        run: |
          echo "BINUTILS_VER=2.27" >> $GITHUB_ENV
          echo "GCC_VER=4.7.4" >> $GITHUB_ENV
          echo "TARGET_ANDROID=arm-linux-androideabi" >> $GITHUB_ENV
          echo "TARGET_EABI=arm-eabi" >> $GITHUB_ENV
          echo "HOST=aarch64-linux-gnu" >> $GITHUB_ENV
          echo "PREFIX=/root/toolchain-aarch64" >> $GITHUB_ENV
          echo "CC=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
          echo "CXX=aarch64-linux-gnu-g++" >> $GITHUB_ENV

      - name: Download sources
        run: |
          wget -q https://ftp.gnu.org/gnu/binutils/binutils-$BINUTILS_VER.tar.gz
          wget -q https://ftp.gnu.org/gnu/gcc/gcc-$GCC_VER/gcc-$GCC_VER.tar.gz
          tar xf binutils-$BINUTILS_VER.tar.gz
          tar xf gcc-$GCC_VER.tar.gz
          cd gcc-$GCC_VER && ./contrib/download_prerequisites

      - name: Patch config.sub and config.guess for aarch64
        run: |
          wget -q 'https://git.savannah.gnu.org/cgit/config.git/plain/config.sub' \
            -O config.sub.new
          wget -q 'https://git.savannah.gnu.org/cgit/config.git/plain/config.guess' \
            -O config.guess.new
          for dir in gcc-$GCC_VER binutils-$BINUTILS_VER; do
            find $dir -name 'config.sub'   -exec cp config.sub.new   {} \;
            find $dir -name 'config.guess' -exec cp config.guess.new {} \;
          done
          echo "patched"

      - name: Build binutils (arm-linux-androideabi)
        run: |
          mkdir build-binutils-android && cd build-binutils-android
          ../binutils-$BINUTILS_VER/configure \
            --prefix=$PREFIX/arm-linux-androideabi-4.7 \
            --target=$TARGET_ANDROID \
            --host=$HOST \
            --build=x86_64-linux-gnu \
            --disable-nls \
            --disable-multilib \
            --disable-werror \
            --with-sysroot
          make -j$(nproc) CC=$CC CXX=$CXX
          make install

      - name: Build GCC (arm-linux-androideabi)
        run: |
          mkdir build-gcc-android && cd build-gcc-android
          ../gcc-$GCC_VER/configure \
            --prefix=$PREFIX/arm-linux-androideabi-4.7 \
            --target=$TARGET_ANDROID \
            --host=$HOST \
            --build=x86_64-linux-gnu \
            --enable-languages=c,c++ \
            --disable-nls \
            --disable-multilib \
            --disable-shared \
            --disable-libssp \
            --disable-libgomp \
            --disable-libmudflap \
            --with-arch=armv7-a \
            --with-float=softfp \
            --with-fpu=vfpv3-d16 \
            --with-gnu-as \
            --with-gnu-ld \
            --disable-werror
          make -j$(nproc) all-gcc CC=$CC CXX=$CXX
          make install-gcc
          make -j$(nproc) all-target-libgcc
          make install-target-libgcc

      - name: Build binutils (arm-eabi)
        run: |
          mkdir build-binutils-eabi && cd build-binutils-eabi
          ../binutils-$BINUTILS_VER/configure \
            --prefix=$PREFIX/arm-eabi-4.7 \
            --target=$TARGET_EABI \
            --host=$HOST \
            --build=x86_64-linux-gnu \
            --disable-nls \
            --disable-multilib \
            --disable-werror
          make -j$(nproc) CC=$CC CXX=$CXX
          make install

      - name: Build GCC (arm-eabi)
        run: |
          mkdir build-gcc-eabi && cd build-gcc-eabi
          ../gcc-$GCC_VER/configure \
            --prefix=$PREFIX/arm-eabi-4.7 \
            --target=$TARGET_EABI \
            --host=$HOST \
            --build=x86_64-linux-gnu \
            --enable-languages=c,c++ \
            --disable-nls \
            --disable-multilib \
            --disable-shared \
            --disable-threads \
            --disable-libssp \
            --disable-libgomp \
            --disable-libmudflap \
            --without-headers \
            --with-newlib \
            --disable-werror
          make -j$(nproc) all-gcc CC=$CC CXX=$CXX
          make install-gcc
          make -j$(nproc) all-target-libgcc
          make install-target-libgcc

      - name: Bundle glibc alongside toolchain
        run: |
          GLIBC_DIR=$PREFIX/glibc
          mkdir -p $GLIBC_DIR
          for bin in \
            $PREFIX/arm-linux-androideabi-4.7/bin/arm-linux-androideabi-gcc \
            $PREFIX/arm-linux-androideabi-4.7/bin/arm-linux-androideabi-g++ \
            $PREFIX/arm-linux-androideabi-4.7/bin/arm-linux-androideabi-as \
            $PREFIX/arm-linux-androideabi-4.7/bin/arm-linux-androideabi-ld \
            $PREFIX/arm-eabi-4.7/bin/arm-eabi-gcc \
            $PREFIX/arm-eabi-4.7/bin/arm-eabi-g++ \
            $PREFIX/arm-eabi-4.7/bin/arm-eabi-as \
            $PREFIX/arm-eabi-4.7/bin/arm-eabi-ld; do
            if [ -f "$bin" ]; then
              ldd "$bin" | awk '{print $3}' | grep '^/' | while read lib; do
                cp -n "$lib" $GLIBC_DIR/ 2>/dev/null || true
              done
            fi
          done
          find /lib/aarch64-linux-gnu /lib -name 'ld-linux-aarch64*' \
            -exec cp {} $GLIBC_DIR/ \; 2>/dev/null || true
          ls $GLIBC_DIR/

      - name: Patch binaries to use bundled glibc
        run: |
          GLIBC_DIR=$PREFIX/glibc
          INTERP=$(find $GLIBC_DIR -name 'ld-linux-aarch64*' | head -1)
          echo "using interpreter: $INTERP"
          for bin in \
            $PREFIX/arm-linux-androideabi-4.7/bin/arm-linux-androideabi-gcc \
            $PREFIX/arm-linux-androideabi-4.7/bin/arm-linux-androideabi-g++ \
            $PREFIX/arm-linux-androideabi-4.7/bin/arm-linux-androideabi-as \
            $PREFIX/arm-linux-androideabi-4.7/bin/arm-linux-androideabi-ld \
            $PREFIX/arm-eabi-4.7/bin/arm-eabi-gcc \
            $PREFIX/arm-eabi-4.7/bin/arm-eabi-g++ \
            $PREFIX/arm-eabi-4.7/bin/arm-eabi-as \
            $PREFIX/arm-eabi-4.7/bin/arm-eabi-ld; do
            if [ -f "$bin" ]; then
              patchelf --set-interpreter $INTERP \
                       --set-rpath $GLIBC_DIR \
                       "$bin" && echo "patched $bin" || true
            fi
          done

      - name: Create launcher wrappers
        run: |
          GLIBC_DIR=$PREFIX/glibc
          for toolchain in arm-linux-androideabi-4.7 arm-eabi-4.7; do
            BINDIR=$PREFIX/$toolchain/bin
            for bin in $BINDIR/*; do
              [ -f "$bin" ] && [ ! -L "$bin" ] || continue
              real="$bin.real"
              mv "$bin" "$real"
              cat > "$bin" <<WRAPPER
#!/bin/sh
export LD_LIBRARY_PATH="$GLIBC_DIR:\$LD_LIBRARY_PATH"
exec "$real" "\$@"
WRAPPER
              chmod +x "$bin"
            done
          done

      - name: Verify
        run: |
          $PREFIX/arm-linux-androideabi-4.7/bin/arm-linux-androideabi-gcc --version
          $PREFIX/arm-eabi-4.7/bin/arm-eabi-gcc --version
          file $PREFIX/arm-linux-androideabi-4.7/bin/arm-linux-androideabi-gcc.real

      - name: Package toolchain
        run: |
          cd /root
          tar cJf toolchain-aarch64-cm11.tar.xz toolchain-aarch64/
          ls -lh toolchain-aarch64-cm11.tar.xz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: toolchain-aarch64-cm11
          path: /root/toolchain-aarch64-cm11.tar.xz
          retention-days: 30
