name: Build aarch64 Android Toolchain for CM11

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            libc6-dev-arm64-cross \
            libgmp-dev libmpfr-dev libmpc-dev \
            zlib1g-dev \
            flex bison texinfo \
            git zip patchelf xz-utils \
            qemu-user-static

      - name: Set env
        run: |
          echo "PREFIX=$HOME/tc"                      >> $GITHUB_ENV
          echo "CC=aarch64-linux-gnu-gcc"             >> $GITHUB_ENV
          echo "CXX=aarch64-linux-gnu-g++"            >> $GITHUB_ENV
          echo "AR=aarch64-linux-gnu-ar"              >> $GITHUB_ENV
          echo "RANLIB=aarch64-linux-gnu-ranlib"      >> $GITHUB_ENV
          echo "NM=aarch64-linux-gnu-nm"              >> $GITHUB_ENV
          echo "STRIP=aarch64-linux-gnu-strip"        >> $GITHUB_ENV

      - name: Download sources
        run: |
          wget -q https://ftp.gnu.org/gnu/binutils/binutils-2.27.tar.gz
          wget -q https://ftp.gnu.org/gnu/gcc/gcc-4.9.4/gcc-4.9.4.tar.gz
          tar xf binutils-2.27.tar.gz
          tar xf gcc-4.9.4.tar.gz
          cd gcc-4.9.4 
          ./contrib/download_prerequisites
          # Fix timestamp skew on downloaded prerequisites to prevent flex errors
          touch gmp/configure mpfr/configure mpc/configure 2>/dev/null || true
          cd ..

      - name: Patch config for aarch64
        run: |
          cp $GITHUB_WORKSPACE/config.sub config.sub.new
          cp $GITHUB_WORKSPACE/config.guess config.guess.new
          for dir in gcc-4.9.4 binutils-2.27; do
            find $dir -name 'config.sub'   -exec cp config.sub.new   {} \;
            find $dir -name 'config.guess' -exec cp config.guess.new {} \;
          done

      - name: Patch GCC 4.9 for modern host
        run: |
          cd gcc-4.9.4
          # Fix collect2.c siginfo issue
          sed -i 's/sa.sa_flags = SA_SIGINFO/sa.sa_flags = 0/g' \
            gcc/collect2.c 2>/dev/null || true
          # Disable -Werror in fixincludes
          sed -i 's/-Werror//' fixincludes/Makefile.in 2>/dev/null || true
          # Fix obsolete throw() specs in C++ that cause errors with GCC 9+
          sed -i 's/throw()//g' \
            libstdc++-v3/libsupc++/exception 2>/dev/null || true

      - name: Build binutils arm-linux-androideabi
        run: |
          mkdir build-binutils-android && cd build-binutils-android
          ../binutils-2.27/configure \
            --prefix=$HOME/tc/arm-linux-androideabi-4.9 \
            --target=arm-linux-androideabi \
            --host=aarch64-linux-gnu \
            --build=x86_64-linux-gnu \
            --disable-nls \
            --disable-multilib \
            --disable-werror \
            --with-sysroot
          make -j$(nproc) \
            CC=aarch64-linux-gnu-gcc \
            CXX=aarch64-linux-gnu-g++ \
            AR=aarch64-linux-gnu-ar \
            RANLIB=aarch64-linux-gnu-ranlib
          make install

      - name: Add androideabi binutils to PATH
        run: echo "$HOME/tc/arm-linux-androideabi-4.9/bin" >> $GITHUB_PATH

      - name: Build GCC arm-linux-androideabi
        run: |
          mkdir build-gcc-android && cd build-gcc-android
          ../gcc-4.9.4/configure \
            --prefix=$HOME/tc/arm-linux-androideabi-4.9 \
            --target=arm-linux-androideabi \
            --host=aarch64-linux-gnu \
            --build=x86_64-linux-gnu \
            --enable-languages=c,c++ \
            --disable-nls \
            --disable-multilib \
            --disable-shared \
            --disable-libssp \
            --disable-libgomp \
            --disable-libmudflap \
            --disable-libquadmath \
            --disable-libsanitizer \
            --disable-bootstrap \
            --disable-libstdcxx-pch \
            --disable-lto \
            --with-arch=armv7-a \
            --with-float=softfp \
            --with-fpu=vfpv3-d16 \
            --with-gnu-as \
            --with-gnu-ld \
            --with-system-zlib \
            --disable-werror
          make -j$(nproc) all-gcc \
            MAKEINFO=missing \
            CFLAGS_FOR_BUILD="-O2" \
            CXXFLAGS_FOR_BUILD="-O2" \
            CXXFLAGS="-O2 -std=gnu++98" \
            CFLAGS="-O2" \
            CC=aarch64-linux-gnu-gcc \
            CXX=aarch64-linux-gnu-g++ \
            AR=aarch64-linux-gnu-ar \
            RANLIB=aarch64-linux-gnu-ranlib
          make install-gcc
          make -j$(nproc) all-target-libgcc \
            MAKEINFO=missing \
            CC=aarch64-linux-gnu-gcc \
            CXX=aarch64-linux-gnu-g++ \
            AR=aarch64-linux-gnu-ar \
            RANLIB=aarch64-linux-gnu-ranlib
          make install-target-libgcc

      - name: Build binutils arm-eabi
        run: |
          mkdir build-binutils-eabi && cd build-binutils-eabi
          ../binutils-2.27/configure \
            --prefix=$HOME/tc/arm-eabi-4.9 \
            --target=arm-eabi \
            --host=aarch64-linux-gnu \
            --build=x86_64-linux-gnu \
            --disable-nls \
            --disable-multilib \
            --disable-werror
          make -j$(nproc) \
            CC=aarch64-linux-gnu-gcc \
            CXX=aarch64-linux-gnu-g++ \
            AR=aarch64-linux-gnu-ar \
            RANLIB=aarch64-linux-gnu-ranlib
          make install

      - name: Add eabi binutils to PATH
        run: echo "$HOME/tc/arm-eabi-4.9/bin" >> $GITHUB_PATH

      - name: Build GCC arm-eabi
        run: |
          mkdir build-gcc-eabi && cd build-gcc-eabi
          ../gcc-4.9.4/configure \
            --prefix=$HOME/tc/arm-eabi-4.9 \
            --target=arm-eabi \
            --host=aarch64-linux-gnu \
            --build=x86_64-linux-gnu \
            --enable-languages=c,c++ \
            --disable-nls \
            --disable-multilib \
            --disable-shared \
            --disable-threads \
            --disable-libssp \
            --disable-libgomp \
            --disable-libmudflap \
            --disable-libquadmath \
            --disable-libsanitizer \
            --disable-bootstrap \
            --disable-libstdcxx-pch \
            --disable-lto \
            --without-headers \
            --with-newlib \
            --with-system-zlib \
            --disable-werror
          make -j$(nproc) all-gcc \
            MAKEINFO=missing \
            CFLAGS_FOR_BUILD="-O2" \
            CXXFLAGS_FOR_BUILD="-O2" \
            CXXFLAGS="-O2 -std=gnu++98" \
            CFLAGS="-O2" \
            CC=aarch64-linux-gnu-gcc \
            CXX=aarch64-linux-gnu-g++ \
            AR=aarch64-linux-gnu-ar \
            RANLIB=aarch64-linux-gnu-ranlib
          make install-gcc
          make -j$(nproc) all-target-libgcc \
            MAKEINFO=missing \
            CC=aarch64-linux-gnu-gcc \
            CXX=aarch64-linux-gnu-g++ \
            AR=aarch64-linux-gnu-ar \
            RANLIB=aarch64-linux-gnu-ranlib
          make install-target-libgcc

      - name: Bundle aarch64 glibc
        run: |
          GLIBC_DIR=$HOME/tc/glibc
          mkdir -p $GLIBC_DIR
          # Copy required aarch64 libraries from the cross-compiler sysroot
          cp -P /usr/aarch64-linux-gnu/lib/libc.so.6 $GLIBC_DIR/ 2>/dev/null || true
          cp -P /usr/aarch64-linux-gnu/lib/libc-*.so $GLIBC_DIR/ 2>/dev/null || true
          cp -P /usr/aarch64-linux-gnu/lib/libm.so.6 $GLIBC_DIR/ 2>/dev/null || true
          cp -P /usr/aarch64-linux-gnu/lib/libm-*.so $GLIBC_DIR/ 2>/dev/null || true
          cp -P /usr/aarch64-linux-gnu/lib/libdl.so.2 $GLIBC_DIR/ 2>/dev/null || true
          cp -P /usr/aarch64-linux-gnu/lib/libpthread.so.0 $GLIBC_DIR/ 2>/dev/null || true
          cp -P /usr/aarch64-linux-gnu/lib/librt.so.1 $GLIBC_DIR/ 2>/dev/null || true
          cp -P /usr/aarch64-linux-gnu/lib/libgcc_s.so.1 $GLIBC_DIR/ 2>/dev/null || true
          # Copy aarch64 dynamic linker
          cp -P /usr/aarch64-linux-gnu/lib/ld-linux-aarch64.so.1 $GLIBC_DIR/ 2>/dev/null || true
          echo "bundled aarch64 libs:"; ls -lh $GLIBC_DIR/

      - name: Patch binaries for aarch64 host
        run: |
          GLIBC_DIR=$HOME/tc/glibc
          INTERP="/lib/ld-linux-aarch64.so.1"
          for bin in \
            $HOME/tc/arm-linux-androideabi-4.9/bin/arm-linux-androideabi-gcc \
            $HOME/tc/arm-linux-androideabi-4.9/bin/arm-linux-androideabi-g++ \
            $HOME/tc/arm-linux-androideabi-4.9/bin/arm-linux-androideabi-as \
            $HOME/tc/arm-linux-androideabi-4.9/bin/arm-linux-androideabi-ld \
            $HOME/tc/arm-eabi-4.9/bin/arm-eabi-gcc \
            $HOME/tc/arm-eabi-4.9/bin/arm-eabi-g++ \
            $HOME/tc/arm-eabi-4.9/bin/arm-eabi-as \
            $HOME/tc/arm-eabi-4.9/bin/arm-eabi-ld; do
            [ -f "$bin" ] || continue
            patchelf --set-interpreter "$INTERP" \
                     --set-rpath "$GLIBC_DIR" \
                     "$bin" && echo "patched for phone: $(basename $bin)" || true
          done

      - name: Create wrappers
        run: |
          GLIBC_DIR=$HOME/tc/glibc
          for toolchain in arm-linux-androideabi-4.9 arm-eabi-4.9; do
            for bin in $HOME/tc/$toolchain/bin/*; do
              [ -f "$bin" ] && [ ! -L "$bin" ] || continue
              real="${bin}.real"
              mv "$bin" "$real"
              printf '#!/bin/sh\nexport LD_LIBRARY_PATH="%s:$LD_LIBRARY_PATH"\nexec "%s" "$@"\n' \
                "$GLIBC_DIR" "$real" > "$bin"
              chmod +x "$bin"
            done
          done

      - name: Verify
        run: |
          file $HOME/tc/arm-linux-androideabi-4.9/bin/arm-linux-androideabi-gcc.real

      - name: Package
        run: |
          cd $HOME
          tar cJf toolchain-aarch64-cm11.tar.xz tc/
          ls -lh toolchain-aarch64-cm11.tar.xz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: toolchain-aarch64-cm11
          path: ~/toolchain-aarch64-cm11.tar.xz
          retention-days: 30
          
