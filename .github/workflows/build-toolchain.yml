name: Build aarch64 Android Toolchain for CM11

on:
  workflow_dispatch:

env:
  GCC_VER: 4.9.4
  BINUTILS_VER: 2.27
  TARGET: arm-linux-androideabi
  S0: /home/runner/stage0
  TC: /home/runner/tc
  PHONE_TC: /data/data/com.termux/files/home/tc
  HOST_CFLAGS: -O2 -fcommon -w
  HOST_CXXFLAGS: -O2 -fcommon -std=gnu++98 -fpermissive -w

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            libc6-dev-arm64-cross libstdc++6-arm64-cross libgcc-s1-arm64-cross \
            flex bison m4 file git patchelf xz-utils qemu-user-static

      - name: Download and patch sources
        run: |
          wget -q https://ftp.gnu.org/gnu/binutils/binutils-$BINUTILS_VER.tar.gz
          wget -q https://ftp.gnu.org/gnu/gcc/gcc-$GCC_VER/gcc-$GCC_VER.tar.gz
          tar xf binutils-$BINUTILS_VER.tar.gz
          tar xf gcc-$GCC_VER.tar.gz
          cd gcc-$GCC_VER
          sed -i 's|ftp://gcc.gnu.org|https://gcc.gnu.org|' contrib/download_prerequisites
          ./contrib/download_prerequisites
          touch gmp/configure mpfr/configure mpc/configure || true
          sed -i 's/-Werror//' fixincludes/Makefile.in || true
          sed -i '/__attribute__ ((__gnu_inline__))/d' gcc/cp/cfns.h || true
          cd ..
          find gcc-$GCC_VER binutils-$BINUTILS_VER -name config.sub -exec cp "$GITHUB_WORKSPACE/config.sub" {} \;
          find gcc-$GCC_VER binutils-$BINUTILS_VER -name config.guess -exec cp "$GITHUB_WORKSPACE/config.guess" {} \;

      - name: Stage 0 binutils (x86 host)
        run: |
          mkdir s0-binutils && cd s0-binutils
          CFLAGS="$HOST_CFLAGS" ../binutils-$BINUTILS_VER/configure --prefix=$S0 \
            --target=$TARGET --disable-nls --disable-multilib --disable-werror \
            --disable-gold --disable-gprof --disable-sim --disable-gdb
          make -j$(nproc) MAKEINFO=true
          make install MAKEINFO=true
          echo "$S0/bin" >> $GITHUB_PATH

      - name: Stage 0 GCC (x86 host)
        run: |
          mkdir s0-gcc && cd s0-gcc
          MAKEINFO=true LEX=: CFLAGS="$HOST_CFLAGS" CXXFLAGS="$HOST_CXXFLAGS" \
          ../gcc-$GCC_VER/configure --prefix=$S0 --target=$TARGET \
            --enable-languages=c,c++ --disable-nls --disable-multilib \
            --disable-shared --disable-threads --disable-libssp --disable-libgomp \
            --disable-libmudflap --disable-libquadmath --disable-libsanitizer \
            --disable-libatomic --disable-libstdcxx-pch --disable-lto \
            --disable-plugin --without-headers --with-newlib \
            --with-arch=armv7-a --with-float=softfp --with-fpu=vfpv3-d16 \
            --with-gnu-as --with-gnu-ld --disable-werror
          make -j$(nproc) MAKEINFO=true LEX=: all-gcc
          make install-gcc MAKEINFO=true
          make -j$(nproc) MAKEINFO=true all-target-libgcc
          make install-target-libgcc MAKEINFO=true

      - name: Stage 1 binutils (aarch64 host)
        run: |
          mkdir s1-binutils && cd s1-binutils
          CC=aarch64-linux-gnu-gcc CXX=aarch64-linux-gnu-g++ \
          CFLAGS="$HOST_CFLAGS" CXXFLAGS="$HOST_CXXFLAGS" \
          ../binutils-$BINUTILS_VER/configure --prefix=$TC \
            --build=x86_64-linux-gnu --host=aarch64-linux-gnu --target=$TARGET \
            --disable-nls --disable-multilib --disable-werror \
            --disable-gold --disable-gprof --disable-sim --disable-gdb
          make -j$(nproc) MAKEINFO=true
          make install MAKEINFO=true

      - name: Stage 1 GCC (aarch64 host)
        run: |
          mkdir s1-gcc && cd s1-gcc
          CC=aarch64-linux-gnu-gcc CXX=aarch64-linux-gnu-g++ \
          CC_FOR_BUILD=gcc CXX_FOR_BUILD=g++ \
          CFLAGS="$HOST_CFLAGS" CXXFLAGS="$HOST_CXXFLAGS" \
          CFLAGS_FOR_BUILD="$HOST_CFLAGS" CXXFLAGS_FOR_BUILD="$HOST_CXXFLAGS" \
          MAKEINFO=true LEX=: \
          ../gcc-$GCC_VER/configure --prefix=$TC \
            --build=x86_64-linux-gnu --host=aarch64-linux-gnu --target=$TARGET \
            --enable-languages=c,c++ --disable-nls --disable-multilib \
            --disable-shared --disable-threads --disable-libssp --disable-libgomp \
            --disable-libmudflap --disable-libquadmath --disable-libsanitizer \
            --disable-libatomic --disable-libstdcxx-pch --disable-lto \
            --disable-plugin --without-headers --with-newlib \
            --with-arch=armv7-a --with-float=softfp --with-fpu=vfpv3-d16 \
            --with-gnu-as --with-gnu-ld --disable-werror
          make -j$(nproc) MAKEINFO=true LEX=: all-gcc
          make install-gcc MAKEINFO=true
          cp -an $S0/lib/gcc/$TARGET/. $TC/lib/gcc/$TARGET/

      - name: Smoke test under qemu
        continue-on-error: true
        run: |
          export QEMU_LD_PREFIX=/usr/aarch64-linux-gnu
          $TC/bin/$TARGET-gcc --version
          echo 'int f(int x){return x*2;}' > t.c
          $TC/bin/$TARGET-gcc -O2 -c t.c -o t.o && file t.o

      - name: Bundle aarch64 glibc
        run: |
          mkdir -p $TC/glibc
          find /usr/aarch64-linux-gnu/lib -maxdepth 1 -name '*.so.*' -exec cp -a {} $TC/glibc/ \;
          ls $TC/glibc

      - name: Patch ELF files for Termux
        run: bash scripts/patch-elf.sh $TC $PHONE_TC

      - name: Package
        run: tar cJf $HOME/toolchain-aarch64-cm11.tar.xz -C $HOME tc

      - uses: actions/upload-artifact@v4
        with:
          name: toolchain-aarch64-cm11
          path: /home/runner/toolchain-aarch64-cm11.tar.xz
          retention-days: 30
