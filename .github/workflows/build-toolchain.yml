name: Build aarch64 Android Toolchain

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential gcc g++ make \
            libgmp-dev libmpfr-dev libmpc-dev \
            libisl-dev libcloog-isl-dev \
            flex bison texinfo \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            curl wget git zip

      - name: Set versions
        run: |
          echo "BINUTILS_VER=2.27" >> $GITHUB_ENV
          echo "GCC_VER=4.9.4" >> $GITHUB_ENV
          echo "TARGET_EABI=arm-eabi" >> $GITHUB_ENV
          echo "TARGET_ANDROID=arm-linux-androideabi" >> $GITHUB_ENV
          echo "HOST=aarch64-linux-gnu" >> $GITHUB_ENV
          echo "PREFIX=$HOME/toolchain-aarch64" >> $GITHUB_ENV

      - name: Download sources
        run: |
          wget -q https://ftp.gnu.org/gnu/binutils/binutils-$BINUTILS_VER.tar.gz
          wget -q https://ftp.gnu.org/gnu/gcc/gcc-$GCC_VER/gcc-$GCC_VER.tar.gz
          tar xf binutils-$BINUTILS_VER.tar.gz
          tar xf gcc-$GCC_VER.tar.gz
          cd gcc-$GCC_VER && ./contrib/download_prerequisites

      - name: Build binutils (arm-eabi)
        run: |
          mkdir build-binutils-eabi && cd build-binutils-eabi
          ../binutils-$BINUTILS_VER/configure \
            --prefix=$PREFIX/arm-eabi-4.9 \
            --target=$TARGET_EABI \
            --host=$HOST \
            --build=x86_64-linux-gnu \
            --disable-nls \
            --disable-multilib \
            --disable-werror
          make -j$(nproc)
          make install

      - name: Build GCC (arm-eabi)
        run: |
          mkdir build-gcc-eabi && cd build-gcc-eabi
          ../gcc-$GCC_VER/configure \
            --prefix=$PREFIX/arm-eabi-4.9 \
            --target=$TARGET_EABI \
            --host=$HOST \
            --build=x86_64-linux-gnu \
            --enable-languages=c,c++ \
            --disable-nls \
            --disable-multilib \
            --disable-shared \
            --disable-threads \
            --disable-libssp \
            --disable-libgomp \
            --disable-libmudflap \
            --without-headers \
            --with-newlib \
            --disable-werror
          make -j$(nproc) all-gcc
          make install-gcc
          make -j$(nproc) all-target-libgcc
          make install-target-libgcc

      - name: Build binutils (arm-linux-androideabi)
        run: |
          mkdir build-binutils-android && cd build-binutils-android
          ../binutils-$BINUTILS_VER/configure \
            --prefix=$PREFIX/arm-linux-androideabi-4.9 \
            --target=$TARGET_ANDROID \
            --host=$HOST \
            --build=x86_64-linux-gnu \
            --disable-nls \
            --disable-multilib \
            --disable-werror
          make -j$(nproc)
          make install

      - name: Build GCC (arm-linux-androideabi)
        run: |
          mkdir build-gcc-android && cd build-gcc-android
          ../gcc-$GCC_VER/configure \
            --prefix=$PREFIX/arm-linux-androideabi-4.9 \
            --target=$TARGET_ANDROID \
            --host=$HOST \
            --build=x86_64-linux-gnu \
            --enable-languages=c,c++ \
            --disable-nls \
            --disable-multilib \
            --disable-shared \
            --with-arch=armv7-a \
            --with-float=softfp \
            --with-fpu=vfpv3-d16 \
            --disable-werror
          make -j$(nproc) all-gcc
          make install-gcc
          make -j$(nproc) all-target-libgcc
          make install-target-libgcc

      - name: Package toolchain
        run: |
          cd $HOME
          tar cJf toolchain-aarch64-android.tar.xz toolchain-aarch64/
          ls -lh toolchain-aarch64-android.tar.xz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: toolchain-aarch64-android
          path: ~/toolchain-aarch64-android.tar.xz
          retention-days: 7
